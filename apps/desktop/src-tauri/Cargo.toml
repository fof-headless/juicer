[workspace]
resolver = "2"

[package]
name = "juicer"
version = "0.1.0"
edition = "2021"

[lib]
name = "juicer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "juicer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
